<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Maintenance (PdM) | Titan Workspace</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        darkBg: '#0f172a', panel: '#1e293b', primary: '#3b82f6',
                        hw: '#0ea5e9', ai: '#f97316', sw: '#10b981', ld: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js & Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        /* Glassmorphism Panels */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Kanban Columns & Cards */
        .kanban-col { min-height: 50vh; border-radius: 0.75rem; transition: background 0.3s; padding-bottom: 2rem; }
        .kanban-col.drag-over { background: rgba(59, 130, 246, 0.1); border: 2px dashed #3b82f6; }
        
        .task-card { cursor: grab; transition: all 0.2s ease-out; border-left-width: 4px; }
        .task-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .task-card:active { cursor: grabbing; transform: scale(0.97); }
        .dragging { opacity: 0.4; transform: scale(1.05); z-index: 50; border: 1px solid #3b82f6; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex h-screen antialiased selection:bg-blue-500 selection:text-white">

    <!-- Sidebar -->
    <aside class="w-20 lg:w-64 glass border-r border-slate-800 flex flex-col justify-between hidden sm:flex transition-all">
        <div>
            <div class="h-16 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800">
                <i class="fa-solid fa-microchip text-blue-500 text-2xl"></i>
                <span class="ml-3 font-bold text-lg hidden lg:block tracking-wide">PdM <span class="text-blue-500">Core</span></span>
            </div>
            <nav class="p-4 space-y-2">
                <a href="#" class="flex items-center p-3 bg-blue-600/10 text-blue-500 rounded-xl">
                    <i class="fa-solid fa-border-all text-lg w-6"></i>
                    <span class="font-semibold hidden lg:block ml-2">Dashboard</span>
                </a>
                <a href="#" class="flex items-center p-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition">
                    <i class="fa-solid fa-chart-line text-lg w-6"></i>
                    <span class="font-semibold hidden lg:block ml-2">Analytics</span>
                </a>
                <a href="#" class="flex items-center p-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition">
                    <i class="fa-solid fa-users text-lg w-6"></i>
                    <span class="font-semibold hidden lg:block ml-2">Team (10)</span>
                </a>
            </nav>
        </div>
        <div class="p-4">
            <button class="w-full flex items-center p-3 text-slate-400 hover:text-white rounded-xl transition">
                <i class="fa-solid fa-gear text-lg w-6"></i>
                <span class="font-semibold hidden lg:block ml-2">Settings</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Topbar -->
        <header class="h-16 glass border-b border-slate-800 flex items-center justify-between px-6 z-10">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Titan Cement Factory Project</h1>
                <p class="text-xs text-slate-400">Graduation Project • Spring 2026</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative hidden md:block">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="searchTasks()" placeholder="Search tasks..." class="pl-10 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-white w-64 transition">
                </div>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg shadow-blue-500/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> New Task
                </button>
            </div>
        </header>

        <!-- Workspace Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-6 scroll-smooth">
            <div class="max-w-7xl mx-auto">
                
                <!-- Analytics Section -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    <!-- Progress Card -->
                    <div class="glass p-6 rounded-2xl col-span-1 lg:col-span-1 flex flex-col justify-center relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl"></div>
                        <h3 class="text-slate-400 text-sm font-semibold mb-2">Overall Project Completion</h3>
                        <div class="flex items-end gap-3 mb-4">
                            <span id="overall-pct" class="text-5xl font-extrabold text-white">0%</span>
                            <span id="task-count" class="text-sm text-slate-400 mb-1">0/18 Tasks Done</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2">
                            <div id="progress-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-2 rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Chart Card -->
                    <div class="glass p-4 rounded-2xl col-span-1 lg:col-span-2 relative h-48">
                        <h3 class="text-slate-400 text-sm font-semibold absolute top-4 left-4">Team Performance (Completed Tasks)</h3>
                        <canvas id="teamChart" class="w-full h-full mt-4"></canvas>
                    </div>
                </div>

                <!-- Kanban Board -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    <!-- To Do -->
                    <div class="flex flex-col">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="font-bold text-slate-200 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span> To Do
                                <span id="count-todo" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full ml-1">0</span>
                            </h2>
                        </div>
                        <div class="kanban-col space-y-3" id="todo"></div>
                    </div>

                    <!-- In Progress -->
                    <div class="flex flex-col">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="font-bold text-slate-200 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)] animate-pulse"></span> In Progress
                                <span id="count-inprogress" class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full ml-1">0</span>
                            </h2>
                        </div>
                        <div class="kanban-col space-y-3" id="inprogress"></div>
                    </div>

                    <!-- Done -->
                    <div class="flex flex-col">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="font-bold text-slate-200 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></span> Done
                                <span id="count-done" class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full ml-1">0</span>
                            </h2>
                        </div>
                        <div class="kanban-col space-y-3" id="done"></div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- JS Logic -->
    <script>
        // Engineering Task Data (English Translation)
        const initialTasks = [
            { id: "t1", title: "Factory Visit & Inspection", desc: "Meet maintenance engineers at Titan Cement, submit official letter, inspect ID Fans, and determine sensor mounting points.", team: "ld", col: "todo" },
            { id: "t2", title: "Budget Collection & Procurement", desc: "Collect budget (500 EGP/member) and purchase ESP32, MPU6050, and MLX90614 sensors.", team: "ld", col: "todo" },
            { id: "t3", title: "System Integration & Testing", desc: "Test full pipeline: Vibration Reading -> TinyML processing -> MQTT -> Grafana.", team: "ld", col: "todo" },
            
            { id: "t4", title: "Sensor Breadboard Wiring", desc: "Wire MPU6050 and MLX90614 to ESP32 via I2C protocol. Validate raw readings.", team: "hw", col: "todo" },
            { id: "t5", title: "High-Frequency Sampling Firmware", desc: "Write C++ code to achieve required sampling rate for accurate FFT vibration analysis.", team: "hw", col: "todo" },
            { id: "t6", title: "Custom PCB & Schematic Design", desc: "Design PCB layout using KiCad/EasyEDA to replace fragile breadboard wiring.", team: "hw", col: "todo" },
            { id: "t7", title: "3D Enclosure & Magnetic Mount", desc: "Design a dust-proof industrial enclosure with a magnetic base for secure machine mounting.", team: "hw", col: "todo" },

            { id: "t8", title: "Signal Processing & FFT", desc: "Use MATLAB/Python to filter noise and apply Fast Fourier Transform (FFT) on raw vibration data.", team: "ai", col: "todo" },
            { id: "t9", title: "Train Anomaly Detection Model", desc: "Develop and train Isolation Forest model to detect deviations from normal bearing behavior.", team: "ai", col: "todo" },
            { id: "t10", title: "Edge AI Implementation (TinyML)", desc: "Compress the trained model via Edge Impulse and deploy it directly onto the ESP32 microcontroller.", team: "ai", col: "todo" },

            { id: "t11", title: "Cloud Server & MQTT Setup", desc: "Deploy MQTT broker and InfluxDB time-series database to handle incoming sensor streams.", team: "sw", col: "todo" },
            { id: "t12", title: "Grafana Dashboard Design", desc: "Design real-time visualization widgets for temperature, vibration peaks, and machine health score.", team: "sw", col: "todo" },
            { id: "t13", title: "Telegram Alert System", desc: "Develop a backend script to trigger instant Telegram notifications upon critical anomaly detection.", team: "sw", col: "todo" }
        ];

        const teams = {
            "ld": { name: "Team Leader", color: "text-purple-400 bg-purple-400/10 border-purple-500", avatar: "TL" },
            "hw": { name: "Hardware", color: "text-sky-400 bg-sky-400/10 border-sky-500", avatar: "HW" },
            "ai": { name: "AI & DSP", color: "text-orange-400 bg-orange-400/10 border-orange-500", avatar: "AI" },
            "sw": { name: "Software", color: "text-emerald-400 bg-emerald-400/10 border-emerald-500", avatar: "SW" }
        };

        let tasks = JSON.parse(localStorage.getItem('pdm_v3_tasks')) || [...initialTasks];
        let myChart = null;

        // Initialize Chart.js
        function initChart() {
            const ctx = document.getElementById('teamChart').getContext('2d');
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';
            
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Team Leader', 'Hardware (4)', 'AI & DSP (3)', 'Software (2)'],
                    datasets: [{
                        label: 'Completed Tasks',
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#8b5cf6', '#0ea5e9', '#f97316', '#10b981'],
                        borderRadius: 6,
                        barThickness: 30
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { stepSize: 1 } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Render Board
        function renderBoard(query = "") {
            document.getElementById('todo').innerHTML = '';
            document.getElementById('inprogress').innerHTML = '';
            document.getElementById('done').innerHTML = '';
            
            let stats = { todo: 0, inprogress: 0, done: 0, ld: 0, hw: 0, ai: 0, sw: 0 };

            tasks.forEach(task => {
                stats[task.col]++;
                if(task.col === 'done') stats[task.team]++; // Count team done tasks

                if (query && !task.title.toLowerCase().includes(query) && !task.desc.toLowerCase().includes(query)) return;

                const t = teams[task.team];
                const el = document.createElement('div');
                el.className = `task-card glass p-4 rounded-xl mb-3 ${t.color} relative group`;
                el.draggable = true;
                el.id = task.id;
                
                if(task.col === 'done') el.classList.add('opacity-50', 'grayscale');

                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold px-2.5 py-1 rounded-md ${t.color}">${t.name}</span>
                        ${task.col === 'done' ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : ''}
                    </div>
                    <h4 class="font-semibold text-sm text-white leading-tight mb-2">${task.title}</h4>
                    <p class="text-xs text-slate-400 line-clamp-2 mb-3 leading-relaxed">${task.desc}</p>
                    <div class="flex justify-between items-center border-t border-slate-700/50 pt-3">
                        <div class="flex -space-x-2">
                            <div class="w-6 h-6 rounded-full bg-slate-700 border border-slate-800 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">${t.avatar}</div>
                        </div>
                        <i class="fa-solid fa-grip text-slate-500 opacity-0 group-hover:opacity-100 transition"></i>
                    </div>
                `;

                // Drag Events
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', task.id);
                    setTimeout(() => el.classList.add('dragging'), 0);
                });
                el.addEventListener('dragend', () => el.classList.remove('dragging'));

                document.getElementById(task.col).appendChild(el);
            });

            // Update Counters & Progress Bar
            document.getElementById('count-todo').innerText = stats.todo;
            document.getElementById('count-inprogress').innerText = stats.inprogress;
            document.getElementById('count-done').innerText = stats.done;

            const total = tasks.length;
            const pct = total === 0 ? 0 : Math.round((stats.done / total) * 100);
            
            document.getElementById('overall-pct').innerText = `${pct}%`;
            document.getElementById('task-count').innerText = `${stats.done}/${total} Tasks Done`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Update Chart
            if (myChart) {
                myChart.data.datasets[0].data = [stats.ld, stats.hw, stats.ai, stats.sw];
                myChart.update();
            }

            localStorage.setItem('pdm_v3_tasks', JSON.stringify(tasks));
        }

        // Setup Drag & Drop
        function setupDnD() {
            document.querySelectorAll('.kanban-col').forEach(col => {
                col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
                col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
                col.addEventListener('drop', e => {
                    e.preventDefault();
                    col.classList.remove('drag-over');
                    const id = e.dataTransfer.getData('text/plain');
                    const task = tasks.find(t => t.id === id);
                    
                    if (task && task.col !== col.id) {
                        task.col = col.id;
                        renderBoard(document.getElementById('searchInput').value);
                        
                        // Fire Confetti if dropped in Done!
                        if(col.id === 'done') {
                            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#10b981', '#3b82f6', '#ffffff'] });
                        }
                    }
                });
            });
        }

        // Search
        function searchTasks() {
            renderBoard(document.getElementById('searchInput').value.toLowerCase());
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            renderBoard();
            setupDnD();
        });
    </script>
</body>
</html>
